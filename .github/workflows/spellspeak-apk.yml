name: Build SpellSpeak Premium APK

on:
  push:
    branches:
      - spellspeak-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 from runner SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct SpellSpeak Android project
        shell: bash
        run: |
          cat spellspeak-build/payload_01.txt \
              spellspeak-build/payload_02.txt \
              spellspeak-build/payload_03.txt \
              spellspeak-build/payload_04.txt \
              spellspeak-build/payload_05.txt \
              spellspeak-build/payload_06.txt > spellspeak_project.b64
          base64 --decode spellspeak_project.b64 > spellspeak_project.zip
          unzip -q spellspeak_project.zip
          test -f SpellSpeakAndroid/settings.gradle.kts
          echo "sdk.dir=$ANDROID_HOME" > SpellSpeakAndroid/local.properties

      - name: Build debug APK
        working-directory: SpellSpeakAndroid
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp SpellSpeakAndroid/app/build/outputs/apk/debug/app-debug.apk SpellSpeak-Premium.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-Premium-APK
          path: SpellSpeak-Premium.apk
          if-no-files-found: error
          retention-days: 7
