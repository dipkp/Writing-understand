name: Build SpellSpeak V4 APK

on:
  push:
    branches: [ "spellspeak-apk-build" ]
    paths:
      - "spellspeak-v4/**"
      - ".github/workflows/spellspeak-v4-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat spellspeak-v4/q*.txt > /tmp/spellspeak-v4.b64
          base64 -d /tmp/spellspeak-v4.b64 > /tmp/spellspeak-v4.zip
          mkdir -p spellspeak-v4/project
          unzip -q /tmp/spellspeak-v4.zip -d spellspeak-v4/project
          test -f spellspeak-v4/project/SpellSpeakV4Android/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 using runner SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        working-directory: spellspeak-v4/project/SpellSpeakV4Android
        run: gradle assembleRelease

      - name: Verify APK and rename
        run: |
          APK="spellspeak-v4/project/SpellSpeakV4Android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" spellspeak-v4/SpellSpeak-V4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-V4-APK
          path: spellspeak-v4/SpellSpeak-V4.apk
