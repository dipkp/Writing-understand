name: Build SpellSpeak V4 APK

on:
  push:
    branches: [ "spellspeak-apk-build" ]
    paths:
      - "spellspeak-v4/**"
      - ".github/workflows/spellspeak-v4-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          rm -rf spellspeak-v4/project
          mkdir -p spellspeak-v4/project
          unzip -q spellspeak-v4/project.zip -d spellspeak-v4/project
          test -f spellspeak-v4/project/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 using runner SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed debug APK
        working-directory: spellspeak-v4/project
        run: gradle assembleDebug

      - name: Verify and rename APK
        run: |
          test -f spellspeak-v4/project/app/build/outputs/apk/debug/app-debug.apk
          cp spellspeak-v4/project/app/build/outputs/apk/debug/app-debug.apk spellspeak-v4/SpellSpeak-V4.apk
          ls -lh spellspeak-v4/SpellSpeak-V4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-V4-APK
          path: spellspeak-v4/SpellSpeak-V4.apk
