name: Build SpellSpeak V3 APK

on:
  push:
    branches: [ "spellspeak-apk-build" ]
    paths:
      - "spellspeak-v3/**"
      - ".github/workflows/spellspeak-v3-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat spellspeak-v3/p1.txt spellspeak-v3/p2.txt spellspeak-v3/p3.txt spellspeak-v3/p4.txt > /tmp/spellspeak-v3.b64
          base64 -d /tmp/spellspeak-v3.b64 > /tmp/spellspeak-v3.zip
          rm -rf spellspeak-v3/project
          mkdir -p spellspeak-v3/project
          unzip -q /tmp/spellspeak-v3.zip -d spellspeak-v3/project
          test -f spellspeak-v3/project/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 using runner SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: spellspeak-v3/project
        run: gradle --no-daemon assembleDebug

      - name: Verify and rename APK
        run: |
          test -s spellspeak-v3/project/app/build/outputs/apk/debug/app-debug.apk
          cp spellspeak-v3/project/app/build/outputs/apk/debug/app-debug.apk spellspeak-v3/SpellSpeak-V3.apk
          unzip -t spellspeak-v3/SpellSpeak-V3.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-V3-APK
          path: spellspeak-v3/SpellSpeak-V3.apk
