name: Build SpellSpeak V6 APK

on:
  push:
    branches: [ "spellspeak-apk-build" ]
    paths:
      - "spellspeak-v6/**"
      - "spellspeak-v5/**"
      - ".github/workflows/spellspeak-v6-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android base
        shell: bash
        run: |
          cat spellspeak-v4/q01.txt spellspeak-v4/q02.txt spellspeak-v4/q03.txt spellspeak-v4/q04.txt spellspeak-v4/q05.txt spellspeak-v4/q06.txt spellspeak-v4/q07.txt spellspeak-v4/q08.txt spellspeak-v4/q09.txt > /tmp/spellspeak-v4.b64
          base64 --decode /tmp/spellspeak-v4.b64 > /tmp/spellspeak-v4.zip
          rm -rf spellspeak-v6/project
          mkdir -p spellspeak-v6/project
          set +e
          unzip -o /tmp/spellspeak-v4.zip -d spellspeak-v6/project
          UNZIP_CODE=$?
          set -e
          echo "legacy unzip exit code: $UNZIP_CODE"
          test -f spellspeak-v6/project/SpellSpeakV4Android/settings.gradle.kts

      - name: Apply repaired library and native safe-inset fix
        shell: bash
        run: |
          ROOT=spellspeak-v6/project/SpellSpeakV4Android
          ASSETS="$ROOT/app/src/main/assets"
          MAIN="$ROOT/app/src/main/java/com/spellspeak/app/MainActivity.java"

          # Keep the V5 repaired library and compact UI.
          cat spellspeak-v5/data00.txt spellspeak-v5/data01.txt spellspeak-v5/data02.txt spellspeak-v5/data03.txt spellspeak-v5/data04.txt > "$ASSETS/words-data.js"
          cat spellspeak-v5/topbar-patch.css >> "$ASSETS/styles.css"
          node --check "$ASSETS/words-data.js"
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('spellspeak-v6/project/SpellSpeakV4Android/app/src/main/assets/words-data.js','utf8'),ctx);
          const d=ctx.window.SPELL_DATA;
          const total=d.categories.reduce((n,c)=>n+c.words.length,0);
          console.log('library:',d.categories.length,'categories /',total,'words');
          if(d.categories.length!==20 || total!==3913) process.exit(2);
          NODE

          # Patch only the system-bar behaviour of the already proven native source.
          # This avoids replacing unrelated reminder / TTS code.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('spellspeak-v6/project/SpellSpeakV4Android')
          main=root/'app/src/main/java/com/spellspeak/app/MainActivity.java'
          s=main.read_text()

          if 'import android.view.WindowInsets;' not in s:
              s=s.replace('import android.view.View;\n', 'import android.view.View;\nimport android.view.WindowInsets;\nimport android.widget.FrameLayout;\n')
          if 'private FrameLayout rootView;' not in s:
              s=s.replace('    private WebView webView;\n', '    private WebView webView;\n    private FrameLayout rootView;\n')

          if 'setDecorFitsSystemWindows(true)' not in s:
              raise SystemExit('Expected V5 decorFits call not found')
          s=s.replace('getWindow().setDecorFitsSystemWindows(true);', 'getWindow().setDecorFitsSystemWindows(false);')

          old='''        webView = new WebView(this);\n        setContentView(webView);'''
          new='''        rootView = new FrameLayout(this);\n        webView = new WebView(this);\n        rootView.addView(webView, new FrameLayout.LayoutParams(\n            FrameLayout.LayoutParams.MATCH_PARENT,\n            FrameLayout.LayoutParams.MATCH_PARENT\n        ));\n        setContentView(rootView);\n        installSystemBarInsets();'''
          if old not in s:
              raise SystemExit('Expected WebView creation block not found')
          s=s.replace(old,new,1)

          marker='    private void applySystemTheme(String theme) {'
          if marker not in s:
              raise SystemExit('applySystemTheme marker not found')
          inset_method='''    private void installSystemBarInsets() {\n        if (rootView == null) return;\n        rootView.setOnApplyWindowInsetsListener((view, insets) -> {\n            int left, top, right, bottom;\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n                android.graphics.Insets bars = insets.getInsets(\n                    WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()\n                );\n                left = bars.left;\n                top = bars.top;\n                right = bars.right;\n                bottom = bars.bottom;\n            } else {\n                left = insets.getSystemWindowInsetLeft();\n                top = insets.getSystemWindowInsetTop();\n                right = insets.getSystemWindowInsetRight();\n                bottom = insets.getSystemWindowInsetBottom();\n            }\n            view.setPadding(left, top, right, bottom);\n            return insets;\n        });\n        rootView.requestApplyInsets();\n    }\n\n'''
          s=s.replace(marker, inset_method+marker,1)

          color_line='        int color = Color.parseColor(light ? "#F4F7FB" : "#081321");'
          if color_line in s:
              s=s.replace(color_line, color_line+'\n        if (rootView != null) rootView.setBackgroundColor(color);\n        if (webView != null) webView.setBackgroundColor(color);',1)

          main.write_text(s)

          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          if 'android:windowSoftInputMode=' not in s:
              s=s.replace('android:name=".MainActivity"\n            android:exported="true"', 'android:name=".MainActivity"\n            android:exported="true"\n            android:windowSoftInputMode="adjustResize"')
          manifest.write_text(s)

          styles=root/'app/src/main/res/values/styles.xml'
          s=styles.read_text()
          if 'android:windowDrawsSystemBarBackgrounds' not in s:
              s=s.replace('<item name="android:windowBackground">#081321</item>', '<item name="android:windowBackground">#081321</item>\n    <item name="android:windowDrawsSystemBarBackgrounds">true</item>')
          styles.write_text(s)

          build=root/'app/build.gradle.kts'
          s=build.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 6', s)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "6.0"', s)
          build.write_text(s)
          PY

          grep -n 'setDecorFitsSystemWindows\|installSystemBarInsets\|setPadding' "$MAIN"
          grep -n 'versionCode\|versionName' "$ROOT/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build V6 APK
        working-directory: spellspeak-v6/project/SpellSpeakV4Android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify and rename APK
        shell: bash
        run: |
          APK=spellspeak-v6/project/SpellSpeakV4Android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" spellspeak-v6/SpellSpeak-V6.apk
          unzip -t spellspeak-v6/SpellSpeak-V6.apk >/dev/null
          ls -lh spellspeak-v6/SpellSpeak-V6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-V6-APK
          path: spellspeak-v6/SpellSpeak-V6.apk
          if-no-files-found: error
          retention-days: 7
