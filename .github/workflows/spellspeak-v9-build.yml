name: Build SpellSpeak V9 APK

on:
  push:
    branches: [ "spellspeak-v9-build" ]
    paths:
      - "spellspeak-v9/**"
      - "spellspeak-v7/**"
      - "spellspeak-v6/**"
      - "spellspeak-v5/**"
      - "spellspeak-v4/**"
      - ".github/workflows/spellspeak-v9-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android base
        shell: bash
        run: |
          cat spellspeak-v4/q01.txt spellspeak-v4/q02.txt spellspeak-v4/q03.txt spellspeak-v4/q04.txt spellspeak-v4/q05.txt spellspeak-v4/q06.txt spellspeak-v4/q07.txt spellspeak-v4/q08.txt spellspeak-v4/q09.txt > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.zip
          rm -rf spellspeak-v9/project
          mkdir -p spellspeak-v9/project
          set +e
          unzip -o /tmp/base.zip -d spellspeak-v9/project
          CODE=$?
          set -e
          echo "legacy unzip code: $CODE"
          test -f spellspeak-v9/project/SpellSpeakV4Android/settings.gradle.kts

      - name: Apply exact SVG logo, navigation and robust audio
        shell: bash
        run: |
          ROOT=spellspeak-v9/project/SpellSpeakV4Android
          ASSETS="$ROOT/app/src/main/assets"
          JAVA="$ROOT/app/src/main/java/com/spellspeak/app"
          RES="$ROOT/app/src/main/res"

          cat spellspeak-v5/data00.txt spellspeak-v5/data01.txt spellspeak-v5/data02.txt spellspeak-v5/data03.txt spellspeak-v5/data04.txt > "$ASSETS/words-data.js"
          cat spellspeak-v5/topbar-patch.css >> "$ASSETS/styles.css"

          # V9: self-healing native TTS bridge; reminders/notifications stay unchanged.
          cp spellspeak-v9/native/MainActivity.java "$JAVA/MainActivity.java"
          cp spellspeak-v6/native/BootReceiver.java "$JAVA/BootReceiver.java"
          cp spellspeak-v6/native/ReminderReceiver.java "$JAVA/ReminderReceiver.java"
          cp spellspeak-v6/native/ReminderScheduler.java "$JAVA/ReminderScheduler.java"
          cp spellspeak-v6/native/NotificationUtil.java "$JAVA/NotificationUtil.java"

          # Reassemble the user's exact SVG from lossless compressed-base64 chunks.
          cat spellspeak-v9/logo_parts/part00.txt spellspeak-v9/logo_parts/part01.txt spellspeak-v9/logo_parts/part02.txt spellspeak-v9/logo_parts/part03.txt spellspeak-v9/logo_parts/part04.txt spellspeak-v9/logo_parts/part05.txt spellspeak-v9/logo_parts/part06.txt spellspeak-v9/logo_parts/part07.txt > /tmp/logo.svg.gz.b64
          echo '9dd60d52bc77b737c34d98d50cbb724ab80f6f557e608d5caec891d744ddb4e1  /tmp/logo.svg.gz.b64' | sha256sum -c -
          base64 --decode /tmp/logo.svg.gz.b64 > /tmp/logo.svg.gz
          gzip -dc /tmp/logo.svg.gz > "$ASSETS/spell-logo.svg"
          echo '77e61c975b614fa916348fc2e1f6476c9bb36a939151607a50d7f3b47b92170b  '"$ASSETS/spell-logo.svg" | sha256sum -c -

          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p "$RES/drawable" "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"

          rsvg-convert -w 432 -h 432 "$ASSETS/spell-logo.svg" > "$RES/drawable-nodpi/spellspeak_v9_foreground.png"
          cat > "$RES/drawable/spellspeak_v9_foreground_inset.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/spellspeak_v9_foreground"
              android:inset="11%" />
          XML
          cat > "$RES/values/spellspeak_v9_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="spellspeak_v9_background">#000000</color></resources>
          XML
          cat > "$RES/mipmap-anydpi-v26/spellspeak_v9.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/spellspeak_v9_background" />
              <foreground android:drawable="@drawable/spellspeak_v9_foreground_inset" />
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/spellspeak_v9.xml" "$RES/mipmap-anydpi-v26/spellspeak_v9_round.xml"

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"; size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" "$ASSETS/spell-logo.svg" > "$RES/mipmap-$density/spellspeak_v9.png"
            cp "$RES/mipmap-$density/spellspeak_v9.png" "$RES/mipmap-$density/spellspeak_v9_round.png"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root=Path('spellspeak-v9/project/SpellSpeakV4Android')
          assets=root/'app/src/main/assets'

          app=assets/'app.js'
          s=app.read_text()

          # Stable WebView -> native bridge: string args prevent JS numeric conversion issues.
          old_speak="function speak(text,rate=settings.rate,repeat=settings.repeat){if(!text)return;if(window.AndroidBridge?.speak){AndroidBridge.speak(String(text),Number(rate),Number(repeat));return}if(window.AndroidApp?.speak){AndroidApp.speak(String(text),Number(rate),Number(repeat));return}if('speechSynthesis'in window){speechSynthesis.cancel();let n=0;const run=()=>{const u=new SpeechSynthesisUtterance(String(text));u.lang='en-GB';u.rate=Number(rate);u.onend=()=>{n++;if(n<repeat)setTimeout(run,220)};speechSynthesis.speak(u)};run()}}"
          new_speak="function speak(text,rate=settings.rate,repeat=settings.repeat){if(!text)return;if(window.AndroidApp?.speakText){AndroidApp.speakText(String(text),String(Number(rate)||0.82),String(Number(repeat)||1));return}if(window.AndroidApp?.speak){AndroidApp.speak(String(text),Number(rate),Number(repeat));return}if(window.AndroidBridge?.speak){AndroidBridge.speak(String(text),Number(rate),Number(repeat));return}if('speechSynthesis'in window){speechSynthesis.cancel();let n=0;const run=()=>{const u=new SpeechSynthesisUtterance(String(text));u.lang='en-GB';u.rate=Number(rate)||0.82;u.onend=()=>{n++;if(n<(Number(repeat)||1))setTimeout(run,220)};speechSynthesis.speak(u)};run()}}"
          if old_speak not in s: raise SystemExit('speak function marker missing')
          s=s.replace(old_speak,new_speak,1)

          back_line="function back(){if(navStack.length>1)navStack.pop();go(navStack[navStack.length-1]||'homePage',false)}"
          native_back="window.ssNativeBack=()=>{const drawer=document.getElementById('drawerShade');if(drawer&&drawer.classList.contains('show')){menuClose();return true}const active=document.querySelector('.page.active')?.id||'homePage';if(navStack.length>1){back();return true}if(active!=='homePage'){navStack=['homePage'];go('homePage',false);return true}return false}"
          if 'window.ssNativeBack=' not in s:
              if back_line not in s: raise SystemExit('back marker missing')
              s=s.replace(back_line,back_line+'\n'+native_back,1)
          else:
              s=re.sub(r"window\.ssNativeBack=\(\)=>\{.*?return false\}",native_back,s,count=1)
          old="function updateHeader(page){const [t,s]=pageInfo[page]||pageInfo.homePage;$('pageTitle').textContent=t;$('pageSub').textContent=s;const home=page==='homePage';$('navBtn').classList.toggle('hidden',!home);$('backBtn').classList.toggle('hidden',home)}"
          new="function updateHeader(page){const [t,s]=pageInfo[page]||pageInfo.homePage;$('pageTitle').textContent=t;$('pageSub').textContent=s;const home=page==='homePage';document.querySelector('.appbar').classList.toggle('inner-page',!home);$('navBtn').classList.toggle('hidden',!home);$('backBtn').classList.toggle('hidden',home)}"
          if old in s: s=s.replace(old,new,1)
          app.write_text(s)

          html=assets/'index.html'
          h=html.read_text()
          h=re.sub(r'<div class="brand-mark" aria-hidden="true">\s*<svg.*?</svg>\s*</div>','<div class="brand-mark logo-brand" aria-hidden="true"><img src="spell-logo.svg" alt=""></div>',h,count=1,flags=re.S)
          html.write_text(h)
          css=assets/'styles.css'
          css.write_text(css.read_text()+'''\n/* V9 exact SVG brand */\n.brand-mark.logo-brand{background:#000;overflow:hidden;padding:0;border:1px solid rgba(255,255,255,.08);box-shadow:none}\n.brand-mark.logo-brand img{width:100%;height:100%;object-fit:contain;display:block}\n.appbar.inner-page .brand-mark.logo-brand{display:none}\n''')

          manifest=root/'app/src/main/AndroidManifest.xml'
          android='http://schemas.android.com/apk/res/android'; A='{'+android+'}'
          ET.register_namespace('android',android)
          tree=ET.parse(manifest); mr=tree.getroot(); application=mr.find('application')
          if application is None: raise SystemExit('application missing')

          # Audio focus permission for reliable native speech.
          perms={p.get(A+'name') for p in mr.findall('uses-permission')}
          if 'android.permission.MODIFY_AUDIO_SETTINGS' not in perms:
              mr.insert(0,ET.Element('uses-permission',{A+'name':'android.permission.MODIFY_AUDIO_SETTINGS'}))

          application.set(A+'icon','@mipmap/spellspeak_v9')
          application.set(A+'roundIcon','@mipmap/spellspeak_v9_round')
          main=None
          for activity in application.findall('activity'):
              if activity.get(A+'name')=='.MainActivity': main=activity; break
          if main is None: raise SystemExit('MainActivity missing')
          main.set(A+'icon','@mipmap/spellspeak_v9'); main.set(A+'roundIcon','@mipmap/spellspeak_v9_round')
          for f in list(main.findall('intent-filter')):
              acts={x.get(A+'name') for x in f.findall('action')}; cats={x.get(A+'name') for x in f.findall('category')}
              if 'android.intent.action.MAIN' in acts and 'android.intent.category.LAUNCHER' in cats: main.remove(f)
          for a in list(application.findall('activity-alias')):
              if a.get(A+'name')=='.LauncherV9': application.remove(a)
          alias=ET.Element('activity-alias',{A+'name':'.LauncherV9',A+'targetActivity':'.MainActivity',A+'exported':'true',A+'label':'SpellSpeak',A+'icon':'@mipmap/spellspeak_v9',A+'roundIcon':'@mipmap/spellspeak_v9_round'})
          f=ET.SubElement(alias,'intent-filter')
          ET.SubElement(f,'action',{A+'name':'android.intent.action.MAIN'})
          ET.SubElement(f,'category',{A+'name':'android.intent.category.LAUNCHER'})
          application.append(alias); tree.write(manifest,encoding='utf-8',xml_declaration=True)

          build=root/'app/build.gradle.kts'; b=build.read_text()
          b=re.sub(r'versionCode\s*=\s*\d+','versionCode = 9',b)
          b=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "9.0"',b)
          build.write_text(b)
          PY

          node --check "$ASSETS/app.js"
          node --check "$ASSETS/words-data.js"
          grep -q 'AndroidApp.speakText' "$ASSETS/app.js"
          grep -q 'public void speakText' "$JAVA/MainActivity.java"
          grep -q 'spell-logo.svg' "$ASSETS/index.html"
          grep -q 'LauncherV9' "$ROOT/app/src/main/AndroidManifest.xml"
          test -s "$RES/mipmap-xxxhdpi/spellspeak_v9.png"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build V9 APK
        working-directory: spellspeak-v9/project/SpellSpeakV4Android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify V9 APK
        shell: bash
        run: |
          APK=spellspeak-v9/project/SpellSpeakV4Android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep -E 'application:|application-icon' | head -20
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -E 'LauncherV9|spellspeak_v9|MODIFY_AUDIO_SETTINGS' | head -30
          cp "$APK" spellspeak-v9/SpellSpeak-V9.apk
          unzip -t spellspeak-v9/SpellSpeak-V9.apk >/dev/null
          rm -rf /tmp/v9check && mkdir /tmp/v9check && cd /tmp/v9check
          unzip -q "$GITHUB_WORKSPACE/spellspeak-v9/SpellSpeak-V9.apk" assets/spell-logo.svg assets/app.js
          echo '77e61c975b614fa916348fc2e1f6476c9bb36a939151607a50d7f3b47b92170b  assets/spell-logo.svg' | sha256sum -c -
          grep -q 'AndroidApp.speakText' assets/app.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellSpeak-V9-APK
          path: spellspeak-v9/SpellSpeak-V9.apk
          if-no-files-found: error
          retention-days: 7
